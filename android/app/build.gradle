plugins { id 'com.android.application' }
def run = (System.getenv("GITHUB_RUN_NUMBER") ?: "1") as Integer
android {
  namespace 'iq.shattalbasra.hmi'
  compileSdk 34
  defaultConfig {
    applicationId "iq.shattalbasra.hmi"
    minSdk 24
    targetSdk 34
    versionCode run
    versionName "1.0." + run
  }
  /* one fixed key, so every new APK installs over the old one and keeps the saved data */
  signingConfigs { fixed { storeFile file('hmi.keystore'); storePassword 'hmi-shatt'; keyAlias 'hmi'; keyPassword 'hmi-shatt' } }
  buildTypes {
    release { signingConfig signingConfigs.fixed; minifyEnabled false }
    debug { signingConfig signingConfigs.fixed }
  }
  compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
  implementation 'androidx.webkit:webkit:1.11.0'
  implementation 'androidx.core:core:1.13.1'
}
